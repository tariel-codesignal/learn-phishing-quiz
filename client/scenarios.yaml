- id: slack-expense-warning
  interface: slack
  intro: "A finance bot pings you about unmatched expenses on your card and asks you to download a CSV within the hour."
  workspace: Company HQ
  channel: "#finance-alerts"
  channel_members: 148
  sender_name: Finance Automation
  sender_handle: finance-bot
  avatar_initials: FA
  avatar_color: "#e01e5a"
  is_bot: true
  verified_app: false
  external_org: External org
  timestamp: 11:18 AM
  body: |
    :warning: @{{name}}, expense policy update. We detected unmatched expenses in your card feed. Download the CSV [here](https://slack-files-secure.s3-us-west-2.amazonaws-notreally.com/expense-anomalies.csv) and respond within 1 hour.
  attachment:
    tag: file shared
    title: Expense anomalies.csv
    url: https://slack-files-secure.s3-us-west-2.amazonaws-notreally.com/expense-anomalies.csv
    description: Auto-export generated from unresolved card transactions.
  reactions:
    - emoji: "👀"
      count: 1
    - emoji: "⚠️"
      count: 3
  thread_replies: 2
  thread_last_reply: 4 minutes ago
  edited: true
  is_phishing: true
  red_flags:
    - Bot appears as an unverified app and shows an external organization badge.
    - File preview links to a spoofed AWS host, not your approved finance systems.
    - Unrealistic one-hour deadline designed to force rushed behavior.
    - Message was edited after posting, which is unusual for automated compliance alerts.
  explanation: |
    Attackers often impersonate internal bots in Slack and attach malicious files. In a real incident, verify the app identity and check the destination domain before opening attachments.

