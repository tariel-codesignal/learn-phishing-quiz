- id: vendor-invoice-payment-change-request
  interface: email
  intro: "You handle vendor payments. A follow-up about an open invoice says the vendor's bank details changed and payment should go to the new account today."
  sender_name: "Alicia Grant | NorthBridge Supplies"
  sender_email: "alicia.grant@northbridgesupplies-billing.com"
  subject: "RE: April invoice payment — updated remittance details"
  timestamp: Wed, 26 Feb 2026 at 10:14 AM
  preview_badge: External
  reply_to: "remittance@northbridge-supplies.com"
  mailed_by: "mailservice-transactional.net"
  signed_by: "northbridgesupplies-billing.com"
  body: |
    Hi {{name}},

    Following up on the open April invoice. Our finance team has moved to a new remittance account and needs payments sent to the updated details effective immediately.

    To avoid processing delays, please confirm the change for {{email}} and update the vendor record today using the form below:
    [NorthBridge Remittance Update Form](https://northbridge-supplies.com.remit-update.center/vendor)

    If you have already scheduled the payment, reply with the payment reference so we can reconcile it.

    Thanks,
    Alicia Grant
    Accounts Receivable | NorthBridge Supplies
    +1 (212) 555-0194
  is_phishing: true
  red_flags:
    - Sender email domain "northbridgesupplies-billing.com" differs from the vendor brand domain referenced elsewhere ("northbridge-supplies.com").
    - The link destination uses a deceptive subdomain pattern ("northbridge-supplies.com.remit-update.center") that is not the vendor’s real domain.
    - Requests an urgent change to remittance/banking details, a common payment diversion tactic.
    - Reply-To address differs from the From address, indicating the conversation could be redirected outside the apparent sender domain.
    - Mailed-by domain is unrelated to the vendor, suggesting third-party bulk sending rather than normal vendor correspondence.
  explanation: |
    This email attempts to redirect payments by requesting an urgent remittance change and sending you to a lookalike domain. Validate vendor banking changes via established out-of-band contacts and approved vendor management processes before updating records or initiating payments.
  doc_embed:
    type: "form"
    title: "NorthBridge Remittance Update"
    url: "https://northbridge-supplies.com.remit-update.center/vendor"

- id: email-credentials-reset
  interface: email
  intro: "An IT security notice says your password expires within the hour and gives you a link to keep your account active."
  sender_name: Alex @ IT Support
  sender_email: service-security@corp-it-support.com
  subject: Immediate credential reset required
  timestamp: Mon, 22 Apr 2024 at 8:14 AM
  reply_to: harvester@suspicious-reset.ru
  mailed_by: bulk-mail.xyz
  signed_by: bulk-mail.xyz
  body: |
    Hi {{name}},

    Our monitoring flagged suspicious OAuth attempts tied to {{email}}. Your mailbox will be locked if you do not confirm ownership within the next 30 minutes.

    Review the action via **Security Center**: [security.google.com/settings/security/alerts](https://corp-auth-reinstate.com/login?email={{email}})

    If the above alert looks unfamiliar, open the "Account Recovery" handoff to keep _access_ active: [Reset access portal](https://credential-lock-team.info/restore)

    Stay vigilant,
    IT Support Desk
  is_phishing: true
  red_flags:
    - Sender address slightly mimics IT but uses an external domain.
    - Reply-to address routes to harvester@suspicious-reset.ru.
    - Link text says security.google.com but actually goes to a fake portal.
    - Urgent lockout timer plus vague "suspicious activity" message.
    - Mailed-by header exposes bulk-mail.xyz instead of the corporate domain.
  explanation: |
    Real security notifications use the official `it.company.com` domain and never threaten deactivation within minutes. The "reply-to" and "mailed-by" headers plus the real link target all expose the impersonation.

- id: email-quarterly-update
  interface: email
  intro: "A teammate shares the Q2 roadmap notes ahead of tomorrow's planning sync."
  sender_name: Priya Raman
  sender_email: priya.raman@company.com
  subject: Q2 product roadmap notes
  timestamp: Thu, 9 May 2024 at 4:42 PM
  mailed_by: mail.company.com
  signed_by: company.com
  doc_embed:
    type: sheets
    title: Q2 Milestones - Product Org
    url: https://docs.google.com/spreadsheets/d/official-roadmap
  body: |
    Hi {{name}},

    Thanks for jumping on the roadmap sync earlier today. Sharing my notes plus the finalized milestone spreadsheet straight to {{email}} so you can annotate before I recap to leadership.

    **Action items:**
    - Tag any blockers inside the sheet.
    - Drop comments on the "Northstar metrics" tab.

    Drive folder: [drive.google.com/file/d/official-roadmap](https://drive.google.com/file/d/official-roadmap)

